# [overrides.<mod_id>."<mc_version>"] pisa, campo por campo, el bloque ["<mc_version>"]
# de arriba solo para ese mod_id. No hace falta declarar todos los campos: los que
# faltan se heredan del bloque base de esa versión. Ejemplo:
#
# [overrides.mod."1.21.1"]
# neo_version = "21.1.180"
# neo_version_range = "[21.1,21.2)"
#
# [overrides.mod."1.21.4"]
# parchment_mappings_version = "2025.02.09"

# Perfiles de versiones: listas reutilizables por nombre, para no repetir la
# misma lista en cada mod.stonecutter.properties.toml. Un mod los usa así,
# en su propio [stonecutter], en vez de listar "versions" a mano:
#
#   [stonecutter]
#   profile = "legacy"
#   extra_versions = ["26.1"]      # opcional: suma versiones al perfil
#   exclude_versions = ["1.21.4"]  # opcional: saca versiones del perfil
#
# Si un mod pone "versions" directamente (como hace hoy Celeris), eso gana
# siempre y "profile"/"extra_versions"/"exclude_versions" se ignoran --
# 100% retrocompatible, no rompe ningún mod existente.
#
# El bloque de datos por versión (minecraft_version, neo_version, etc.) puede
# vivir acá (compartido) o en el propio TOML del mod (como hace Celeris con
# las versiones que todavía no están en el set común) -- un perfil solo
# nombra versiones, no importa dónde esté definido cada bloque ["<version>"].
# Un mod puede además declarar sus propios [stonecutter.profiles.*] si
# necesita un perfil a medida que no tenga sentido compartir.
#
# Para probar rápido con un subconjunto sin tocar ningún TOML:
#   ./gradlew build -Pstonecutter.versions=1.21.1,26.1
# ---------------------------------------------------------------------------


[stonecutter.profiles.legacy]
versions = ["1.21.1", "1.21.3"]


[stonecutter.profiles.current]
versions = ["1.21.1"]

[mod]
id = "dice_and_delish"
