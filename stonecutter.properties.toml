authors = "Bichal"
description = "A fresh, lightweight cooking and farming expansion adding wild crops, pole-grown tomatoes, grill workstations, and delicious new recipes to Minecraft."
side = "BOTH"
issues = "https://github.com/PanzerDevOrg/DiceAndDelish/issues"
banner = "banner.png"


